<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Active Recall · Prelims Navigator Program 2027 · Sarrthi IAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --panel-h:#fcfbf8; --line:#ebe7df; --line2:#ddd7cc;
  --ink:#2a2833; --muted:#76727f; --dim:#a39fa9;
  --accent:#6b5fd3; --accent2:#8a80e0; --accent-soft:#eeebfc; --accent-ink:#4c42a8;
  --again:#d9634f; --hard:#d39a2c; --good:#3d9a6c; --easy:#4f7fd0;
  --again-bg:#fdebe7; --hard-bg:#fdf3dc; --good-bg:#e3f4ea; --easy-bg:#e6eefb;
  --r:18px; --shadow:0 1px 2px rgba(40,30,60,.04),0 6px 20px -8px rgba(40,30,60,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14.5px;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(900px 500px at 100% -10%,#efeafd 0,transparent 60%),radial-gradient(800px 500px at -10% 110%,#e5f3ec 0,transparent 60%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
::selection{background:#ddd7fa}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

aside{border-right:1px solid var(--line);padding:26px 16px 20px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;background:rgba(255,255,255,.6);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 28px}
.emblem{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-family:Fraunces;font-size:21px;font-weight:700;background:linear-gradient(135deg,#a79cf0,#6b5fd3);box-shadow:0 6px 16px -6px rgba(107,95,211,.6)}
.brand b{font-family:Fraunces;font-size:22px;font-weight:700;display:block;line-height:1}
.brand small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:block;margin-top:5px;font-weight:700}
.navlbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:16px 12px 8px;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:600;text-align:left;width:100%;transition:.15s}
.nav:hover{color:var(--ink);background:#f3f1ec}
.nav.active{color:var(--accent-ink);background:var(--accent-soft)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:20px}
.side-card{margin-top:auto;border-radius:16px;padding:16px;background:linear-gradient(135deg,#fde9df,#fbe1ea);border:1px solid #f6d7d0}
.side-card .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#a0584a;font-weight:700}
.side-card .v{font-family:Fraunces;font-size:40px;font-weight:600;color:#7d3a2e;line-height:1.05;margin-top:6px}
.side-card .s{font-size:12px;color:#a0584a}
.linkbtn{margin-top:auto!important;font-size:12px;color:var(--dim);margin-top:12px;padding:4px 12px;text-align:left}
.linkbtn:hover{color:var(--muted)}

main{padding:40px 48px 70px;max-width:1160px;width:100%}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:30px;flex-wrap:wrap}
.head h1{font-size:40px;line-height:1.08;margin-top:8px}
.head h1 em{font-style:italic;color:var(--accent);font-weight:500}
.head p{margin:10px 0 0;color:var(--muted);max-width:580px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line2);color:var(--ink);transition:.15s}
.btn:hover{border-color:#c9c2b5;background:#fbfaf7}
.btn.gold{background:var(--accent);color:#fff;border:none;box-shadow:0 8px 20px -10px rgba(107,95,211,.8)}
.btn.gold:hover{background:#5d51c6}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}

.hero{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;margin-bottom:16px}
.today{position:relative;overflow:hidden;padding:26px 28px;background:linear-gradient(135deg,#eeebfc,#f6f3ff 55%,#fff);border-color:#e1dcf8}
.today .big{font-family:Fraunces;font-size:60px;font-weight:600;line-height:1;margin:10px 0 4px;color:#3a3270}
.today .big small{font-size:20px;color:var(--muted);font-weight:500}
.today p{color:var(--muted);margin:0 0 20px}
.today::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#ddd6fb,transparent 70%)}
.count-card{position:relative;overflow:hidden}
.count-card.c1{background:linear-gradient(135deg,#fde9df,#fff 70%);border-color:#f6dcd1}
.count-card.c2{background:linear-gradient(135deg,#e1f3ea,#fff 70%);border-color:#d3ebdf}
.count-card .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.count-card .days{font-family:Fraunces;font-size:54px;font-weight:600;line-height:1;margin-top:12px}
.count-card.c1 .days{color:#b0523e}.count-card.c2 .days{color:#2f7d58}
.count-card .days span{font-size:16px;color:var(--muted);margin-left:6px;font-family:"Plus Jakarta Sans";font-weight:600}
.count-card .date{font-size:12.5px;color:var(--muted);margin-top:8px}
.count-card .track{height:5px;background:rgba(0,0,0,.05);border-radius:5px;margin-top:16px;overflow:hidden}
.count-card.c1 .track i{background:#eda08d}.count-card.c2 .track i{background:#8fcfac}
.count-card .track i{display:block;height:100%;border-radius:5px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .num{font-family:Fraunces;font-size:34px;font-weight:600;margin-top:4px;line-height:1.1}
.kpi .sub{font-size:11.5px;color:var(--dim)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:38px 0 16px;gap:12px;flex-wrap:wrap}
.section-title h2{font-size:26px}
.section-title .muted{font-size:12.5px}

.papers{grid-template-columns:repeat(3,1fr)}
.paper{display:flex;align-items:center;gap:16px}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces;font-size:18px;font-weight:600}
.paper h3{font-size:20px}
.paper .muted{font-size:12px;line-height:1.4;margin-top:2px}

.decks{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.deck{display:flex;flex-direction:column;gap:14px;transition:.18s;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bgc) 0,#fff 46%)}
.deck:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(40,30,60,.22)}
.deck .top{display:flex;gap:14px;align-items:flex-start}
.glyph{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-family:Fraunces;font-size:20px;font-weight:700;color:var(--c);background:var(--bgc);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.deck h3{font-size:21px;line-height:1.15}
.deck .meta{font-size:12px;color:var(--muted);margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f3f1ec;color:var(--muted)}
.tag.gs{color:var(--accent-ink);background:var(--accent-soft)}
.tag.due{color:#b9473a;background:var(--again-bg)}
.tag.new{color:#3c66b3;background:var(--easy-bg)}
.bar{height:6px;background:#f0ede6;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--c,var(--accent))}
.deck .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.deck .actions{display:flex;gap:8px;margin-top:auto}
.deck .btn.gold{background:var(--c);box-shadow:0 8px 18px -10px var(--c)}
.deck .btn.gold:hover{filter:brightness(.94)}

.heat{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:#f0ede6}
.heat i.l1{background:#dcd6fa}.heat i.l2{background:#b7adf2}.heat i.l3{background:#8f82e4}.heat i.l4{background:#6b5fd3}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.study-wrap{max-width:780px;margin:0 auto}
.study-top{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.study-top .bar{flex:1}
.study-top .bar i{background:linear-gradient(90deg,#a79cf0,#6b5fd3)}
.flash{background:#fff;color:var(--ink);border-radius:24px;min-height:360px;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;border:1px solid var(--line);
  box-shadow:0 30px 60px -30px rgba(60,40,110,.25),0 2px 6px rgba(40,30,60,.04)}
.flash::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:24px 24px 0 0;background:var(--c,var(--accent));opacity:.55}
.flash .q{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:20px;font-weight:500;line-height:1.55;color:var(--ink)}
.flash .a{margin-top:28px;padding-top:26px;border-top:1px dashed var(--line2);font-size:17px;line-height:1.65;white-space:pre-wrap;color:#3d3a45}
.flash .src{margin-top:16px;color:var(--dim);font-style:italic;font-family:Fraunces;font-size:15px}
.flash .corner{position:absolute;top:24px;left:28px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--muted));font-weight:700}
.flash .corner2{position:absolute;top:21px;right:26px;display:flex;gap:6px}
.flash .ptag{font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:#f3f1ec;color:var(--muted)}
.flash .ptag.gold{background:#fdf1d2;color:#9a6f10}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.rate button{padding:14px 6px 12px;border-radius:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s;border:1px solid transparent}
.rate button small{font-weight:600;font-size:12px;opacity:.75}
.rate button:hover{transform:translateY(-2px);border-color:currentColor}
.rate .r1{color:#b9473a;background:var(--again-bg)}.rate .r2{color:#9a6f10;background:var(--hard-bg)}.rate .r3{color:#2b7a52;background:var(--good-bg)}.rate .r4{color:#3c66b3;background:var(--easy-bg)}
.kbd{font-size:10.5px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted);font-weight:700;background:#fff}
.reveal{width:100%;margin-top:18px;padding:16px;font-size:15px}
.hint{color:var(--dim);text-align:center;font-size:12.5px;margin-top:14px}
.done{text-align:center;padding:64px 24px}
.done .seal{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:36px;background:linear-gradient(135deg,#8fcfac,#3d9a6c);box-shadow:0 0 0 10px #e3f4ea}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 14px;border-radius:30px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted);background:#fff;transition:.12s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:#cfc8f6;color:var(--accent-ink)}

label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;margin:16px 0 7px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:12px;background:#fff}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.drop{border:2px dashed #cfc8f6;border-radius:var(--r);padding:44px 30px;text-align:center;background:linear-gradient(180deg,#f6f4ff,#fff);transition:.15s}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop h3{font-size:24px;margin-bottom:6px}
.muted{color:var(--muted)}
.two{grid-template-columns:1.25fr 1fr}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
tr:last-child td{border-bottom:none}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:9px 0 9px 40px;position:relative;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
code{background:#f3f1ec;padding:1px 6px;border-radius:5px;font-size:12.5px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(42,40,51,.28);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:28px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 40px 80px -30px rgba(40,30,60,.4)}
.modal h2{font-size:28px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* revise popup */
.rv-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.rv-sec{margin-top:22px}
.rv-sec .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.rv-sec .lbl button{font-size:12px;font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
.counts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.counts .chip{min-width:56px}
.counts input{width:92px;padding:8px 10px;border-radius:30px;text-align:center}
.topics-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:280px;overflow:auto;padding:2px}
.topic{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;transition:.12s;user-select:none;margin:0;color:var(--ink);letter-spacing:0}
.topic:hover{border-color:var(--line2)}
.topic input{display:none}
.topic .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.topic.on{background:var(--bgc,var(--accent-soft));border-color:color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.topic.on .box{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.topic.on .box::after{content:"✓"}
.topic .n{margin-left:auto;white-space:nowrap;font-size:11.5px;color:var(--muted);font-weight:700}
.topic .d{font-size:10.5px;color:#b9473a;font-weight:800;margin-left:6px}
.btabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:#f3f0ea}
.btabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);text-align:left}
.btabs button small{font-size:11.5px;font-weight:600;color:var(--muted)}
.btabs button.on{background:#fff;color:var(--c,var(--ink));box-shadow:0 1px 3px rgba(40,30,10,.12)}
.btabs button:disabled{opacity:.45;cursor:default}
.rv-sum{margin-top:20px;padding:14px 16px;border-radius:14px;background:#f7f5f1;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.rv-sum b{color:var(--ink);font-size:15px}
.seg{display:inline-flex;background:#f3f1ec;border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}



/* ===== Sarrthi IAS header ===== */
:root{--navy:#0d4a8a;--navy2:#0a3a6e;--gold:#f6a81c;--hdr:94px}
.site-head{position:sticky;top:0;z-index:30}
.ribbon{height:32px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,var(--navy2),var(--navy) 50%,var(--navy2));color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.ribbon .star{color:var(--gold);font-size:12px;letter-spacing:0}
.ribbon .yr{color:var(--gold)}
.hbar{height:62px;display:flex;align-items:center;gap:18px;padding:0 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 6px 20px -16px rgba(13,74,138,.35)}
.hbar .logo{height:36px;width:auto;display:block}
.hbar .vsep{width:1px;height:30px;background:var(--line2)}
.hbar .portal{display:flex;flex-direction:column;line-height:1.15}
.hbar .portal b{font-family:Fraunces,Georgia,serif;font-size:17px;color:var(--navy)}
.hbar .portal small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.hbar .hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hbar .pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:30px;background:#fff6e0;border:1px solid #f8dfa4;color:#8a5a00;font-size:12.5px;font-weight:700}
.hbar .pill b{font-family:Fraunces,serif;font-size:16px;color:var(--navy)}
aside{top:var(--hdr)!important;height:calc(100vh - var(--hdr))!important;padding-top:20px!important}
.nav.active{color:var(--navy);background:#e8f0fa}
.nav .count{background:var(--navy)}
@media (max-width:820px){
  .ribbon{font-size:9.5px;letter-spacing:.16em;height:28px}
  .hbar{height:56px;padding:0 14px;gap:10px}.hbar .logo{height:28px}
  .hbar .vsep,.hbar .portal{display:none}.hbar .pill{padding:5px 10px;font-size:11px}
  aside{top:auto!important;height:auto!important}
}

/* card grid (library) */
.gchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.gchip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line2);color:var(--muted)}
.gchip b{color:var(--gink);margin-left:3px}
.gchip.on{background:var(--gbg);color:var(--gink);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.tile{position:relative;background:#fff;border-radius:16px;border:2px solid var(--gbg);box-shadow:var(--shadow);display:flex;flex-direction:column;height:380px;overflow:hidden;cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px -16px rgba(40,30,60,.3)}

.moved-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px;padding:12px 16px;border-radius:14px;background:#ecebff;color:#3a379c;font-size:13.5px}
.tile-pyq{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.65);color:#9a6f10;letter-spacing:.04em}
.star{font-size:20px;line-height:1;color:rgba(0,0,0,.18);padding:2px;transition:.12s}
.star:hover{color:#e8b400;transform:scale(1.15)}.star.on{color:#f2b705;text-shadow:0 1px 0 rgba(150,100,0,.3)}
.tile-b{flex:1;overflow:hidden;padding:12px 16px 0;position:relative;font-size:13px;line-height:1.5}
.tile-b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,#fff)}

.tile-b h1,.tile-b h2,.tile-b h3,.tile-b h4{font-size:13.5px;margin:2px 0 6px;font-family:"Plus Jakarta Sans"}
.tile-b ul,.tile-b ol{padding-left:18px;margin:4px 0}
.tile-b img{display:block;max-width:100%;max-height:150px;margin:6px auto;border-radius:8px;border:1px solid var(--line)}
.tile-b table{border-collapse:collapse;font-size:11.5px;width:100%}.tile-b td,.tile-b th{border:1px solid var(--line2);padding:3px 5px;text-transform:none;letter-spacing:0;font-size:11.5px;color:inherit}

@media (hover:none){.tile-edit{opacity:1;transform:none}}
/* editor */

<script>
/* ============ constants ============ */
const KEY='recall-upsc-v6', DAY=86400000, MIN=60000;
const PRELIMS=new Date('2027-05-23T09:30:00+05:30').getTime();
const MAINS=new Date('2027-08-20T09:00:00+05:30').getTime();
const CYCLE_START=new Date('2026-06-01T00:00:00+05:30').getTime();
const PAPERS={
  GS1:{name:'GS I',desc:'History, Culture, Geography'},
  GS2:{name:'GS II',desc:'Polity, Governance, International Relations'},
  GS3:{name:'GS III',desc:'Economy, Science & Tech, Environment'},
};
/* the 9 subjects — pastel background (bg) + deeper ink colour (c). `file` = a deck shipped with the page */
const SUBJECTS=[
  {key:'polity',   name:'Polity',                 glyph:'⚖', c:'#5a63c9', bg:'#e7e9fb', paper:'GS2', file:'polity.json'},
  {key:'economy',  name:'Economy',                glyph:'₹', c:'#a8770f', bg:'#fcefcc', paper:'GS3'},
  {key:'modern',   name:'Modern History',         glyph:'M', c:'#c25a3e', bg:'#fde3d9', paper:'GS1'},
  {key:'geography',name:'Geography',              glyph:'G', c:'#2f8a62', bg:'#daf2e5', paper:'GS1', file:'geography.json'},
  {key:'mapping',  name:'Mapping',                glyph:'⌖', c:'#2f72b3', bg:'#dbebfa', paper:'GS1'},
  {key:'amac',     name:'AMAC',  full:'Ancient, Medieval & Art and Culture', glyph:'A', c:'#b5487a', bg:'#fbe0ea', paper:'GS1'},
  {key:'ir',       name:'International Relations',glyph:'IR',c:'#23808b', bg:'#d6f0f2', paper:'GS2'},
  {key:'st',       name:'Science & Tech',         glyph:'S', c:'#7c4fb8', bg:'#ece2f8', paper:'GS3'},
  {key:'env',      name:'Environment',            glyph:'E', c:'#5b8a2c', bg:'#e4f1d4', paper:'GS3'},
];
const CLEAN_TAGS=['Marked','New from notes']; // labels that show prior use – removed for a fresh start
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

/* ============ seed data ============ */
function seed(){
  const now=Date.now();
  const decks=SUBJECTS.map(s=>({id:s.key,...s}));
  const cards=[];
  const C=(deckId,front,back,topic,stage,age)=>{
    const c={id:uid(),deckId,front,back,tags:[topic],stage,state:'new',s:0,d:5,due:now,reps:0,lapses:0,last:null};
    cards.push(c);
  };
  // Economy
  C('economy','What is the repo rate?','The rate at which the RBI lends short-term funds to commercial banks against government securities.','Monetary Policy','',5);
  C('economy','Who chairs the Monetary Policy Committee, and how many members does it have?','The RBI Governor; six members (three from the RBI, three appointed by the Centre).','Monetary Policy','');
  C('economy','How is fiscal deficit calculated?','Total expenditure − (revenue receipts + non-debt capital receipts). It shows the government’s total borrowing requirement.','Public Finance','',11);
  C('economy','What does the GDP deflator measure?','The price level of all final goods and services in the economy: (nominal GDP ÷ real GDP) × 100.','National Income','');
  C('economy','What is the Cash Reserve Ratio (CRR)?','The share of a bank’s net demand and time liabilities that it must keep as cash with the RBI.','Banking','',7);
  // Modern History
  C('modern','When and where was the INC founded, and who was its first president?','1885, Bombay — W.C. Bonnerjee presided over the first session.','Moderate Phase','',7);
  C('modern','Who announced the Partition of Bengal, and when?','Lord Curzon, 1905.','Swadeshi Movement','',15);
  C('modern','Who founded the Servants of India Society?','Gopal Krishna Gokhale, in 1905.','Social Reform','',3);
  C('modern','At which session was the Purna Swaraj resolution passed?','Lahore Session, December 1929, presided over by Jawaharlal Nehru.','Gandhian Era','');
  C('modern','Where was Gandhi’s first satyagraha in India?','Champaran, Bihar (1917) — against forced indigo cultivation.','Gandhian Era','');
  C('modern','Who led the Revolt of 1857 at Kanpur?','Nana Saheb, adopted son of Peshwa Baji Rao II.','Revolt of 1857','');
  // Mapping
  C('mapping','Which strait separates India and Sri Lanka?','Palk Strait.','Straits & Passes','',6);
  C('mapping','Which places does the Zoji La pass connect?','The Kashmir Valley (Srinagar) and Ladakh (Leh).','Straits & Passes','',2);
  C('mapping','The Strait of Hormuz connects which two water bodies?','The Persian Gulf and the Gulf of Oman.','Straits & Passes','');
  C('mapping','Kaziranga National Park is in which state, and what is it known for?','Assam — the one-horned rhinoceros.','National Parks','',9);
  C('mapping','Which river is called the “Dakshin Ganga”?','The Godavari.','Rivers','');
  C('mapping','Which west-flowing river runs through a rift valley between the Vindhyas and Satpuras?','The Narmada, which drains into the Arabian Sea.','Rivers','');
  // AMAC
  C('amac','Kathakali is the classical dance of which state?','Kerala.','Dance & Music','',4);
  C('amac','Who built the Sun Temple at Konark?','King Narasimhadeva I of the Eastern Ganga dynasty, 13th century.','Temple Architecture','',10);
  C('amac','The Kailasa temple at Ellora was built under which dynasty?','The Rashtrakutas — a monolithic rock-cut temple in the Dravidian style.','Temple Architecture','');
  C('amac','The Ajanta caves are mainly associated with which religion?','Buddhism.','Buddhism','');
  C('amac','The Great Bath was found at which Harappan site?','Mohenjo-daro.','Indus Valley','',1);
  C('amac','Who founded the Vijayanagara Empire, and when?','Harihara and Bukka, in 1336.','Medieval India','');
  // IR
  C('ir','How many members does BIMSTEC have?','Seven — Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka and Thailand.','Groupings','',5);
  C('ir','Which countries make up the Quad?','India, the United States, Japan and Australia.','Groupings','');
  C('ir','Which countries were the original BRIC members?','Brazil, Russia, India and China. South Africa joined in 2010.','Groupings','');
  C('ir','Name the five permanent members of the UN Security Council.','USA, UK, France, Russia and China.','United Nations','',8);
  C('ir','The Panchsheel Agreement (1954) was signed between which countries?','India and China.','Neighbourhood','');
  // S&T
  C('st','Where did Chandrayaan-3’s lander touch down, and when?','Near the lunar south pole, on 23 August 2023.','Space','',3);
  C('st','Where is Aditya-L1 positioned?','Around the Sun–Earth Lagrange point L1, about 1.5 million km from Earth.','Space','');
  C('st','What is CRISPR-Cas9?','A gene-editing tool that uses a guide RNA and the Cas9 enzyme to cut DNA at a precise location.','Biotechnology','');
  C('st','BrahMos is a joint venture between India and which country?','Russia.','Defence','',12);
  // Environment
  C('env','When and where was the Ramsar Convention signed?','1971, in Ramsar, Iran — for the conservation of wetlands.','International Conventions','',6);
  C('env','What does the Kigali Amendment to the Montreal Protocol target?','Phasing down hydrofluorocarbons (HFCs). Adopted in 2016.','International Conventions','');
  C('env','India’s first Biosphere Reserve?','Nilgiri Biosphere Reserve, 1986.','Protected Areas','',20);
  C('env','Which biodiversity hotspots fall (wholly or partly) in India?','Four — the Himalaya, Indo-Burma, Western Ghats & Sri Lanka, and Sundaland (Nicobar Islands).','Biodiversity','');
  const log={}; // starts empty – fills as you revise
  return {decks,cards,log,newPerDay:12,dailyGoal:60};
}
/* decks shipped with the page as JSON + media/ (your exports, converted) */
async function addShippedDecks(target){
  for(const s of SUBJECTS.filter(s=>s.file)){
    try{
      const g=await (await fetch(s.file)).json(), now=Date.now();
      g.cards.forEach((c,i)=>{
        const topics=c.tags.filter(t=>!CLEAN_TAGS.includes(t)); // drop AlgoApp 'Marked' etc.
        const card={id:uid(),deckId:s.key,front:c.front,back:c.back,html:true,tags:topics,stage:topics.some(t=>/cds|pyq|upsc/i.test(t))?'PYQ':'',state:'new',s:0,d:5,due:now,reps:0,lapses:0,last:null};
        target.cards.push(card);
      });
    }catch(e){ console.log('[recall] could not load',s.file,e); }
  }
}
let db=load();

/* ============ scheduler (FSRS-style, simplified) ============ */
const W_INIT=[0.4,1.2,3.2,15.7];
const retr=(c,now)=>!c.last?1:Math.pow(1+((now-c.last)/DAY)/(9*c.s),-1);
function preview(c,g,now=Date.now()){
  const n={...c};
  if(c.state==='new'){ n.s=W_INIT[g-1]; n.d=Math.min(10,Math.max(1,5-(g-3)*1.2)); }
  else{
    const R=retr(c,now); n.d=Math.min(10,Math.max(1,c.d-0.8*(g-3)));
    if(g===1){ n.s=Math.max(0.2,0.5*Math.pow(c.d,-0.3)*(Math.pow(c.s+1,0.4)-1)*Math.exp((1-R)*1.5)); n.lapses=c.lapses+1; }
    else{ const mod=g===2?0.55:g===4?1.4:1; n.s=c.s*(1+Math.exp(1.2)*(11-n.d)*Math.pow(c.s,-0.2)*(Math.exp((1-R)*1.1)-1)*mod*0.9+(g===2?0.1:0.35)); }
  }
  const ivl=g===1?10*MIN:Math.max(DAY*(g===2&&c.state==='new'?1:Math.round(n.s)||1),DAY);
  n.due=now+ivl; n.ivl=ivl; n.last=now; n.reps=c.reps+1; n.state=g===1?'learning':'review';
  return n;
}
function fmtIvl(ms){ if(ms<DAY)return Math.round(ms/MIN)+' min'; const d=ms/DAY; if(d<31)return Math.round(d)+(Math.round(d)===1?' day':' days'); if(d<365)return (d/30).toFixed(1).replace('.0','')+' mo'; return (d/365).toFixed(1)+' yr'; }

/* ============ queries ============ */
const deckOf=id=>db.decks.find(d=>d.id===id);
const topicsOf=c=>c.tags&&c.tags.length?c.tags:['General'];
const cardsFor=f=>db.cards.filter(c=>{const d=deckOf(c.deckId); if(!d)return false; if(f&&f.deck)return c.deckId===f.deck; if(f&&f.paper)return d.paper===f.paper; return true;});
const isDue=(c,now=Date.now())=>c.state!=='new'&&c.due<=now;
function counts(f){
  const now=Date.now(), cs=cardsFor(f);
  const due=cs.filter(c=>isDue(c,now)).length, nw=cs.filter(c=>c.state==='new').length;
  return {total:cs.length,due,new:nw,newToday:Math.min(nw,db.newPerDay),mature:cs.filter(c=>c.state==='review'&&c.s>=21).length,learned:cs.filter(c=>c.state!=='new').length};
}
const todayKey=()=>new Date().toISOString().slice(0,10);

const OK_TAGS=new Set(['P','BR','B','STRONG','I','EM','U','S','SUB','SUP','SPAN','DIV','H1','H2','H3','H4','H5','H6','UL','OL','LI','TABLE','THEAD','TBODY','TR','TH','TD','IMG','BLOCKQUOTE','HR','CODE','PRE','MARK','FONT']);
function sanitize(htmlStr){
  const doc=new DOMParser().parseFromString('<div>'+htmlStr+'</div>','text/html'); const rootEl=doc.body.firstChild;
  (function walk(el){
    [...el.children].forEach(ch=>{
      // images hosted on other websites can't load inside the portal → turn them into a link
      if(ch.tagName==='IMG'&&/^https?:\/\//i.test(ch.getAttribute('src')||'')){
        const a=doc.createElement('a'); a.href=ch.getAttribute('src'); a.target='_blank'; a.rel='noopener'; a.className='extimg';
        a.textContent='🖼 Open image'+(ch.getAttribute('alt')?' — '+ch.getAttribute('alt').replace(/\s*-\s*$/,''):'')+' ↗'; ch.replaceWith(a); return;
      }
      if(ch.tagName==='A'){const href=ch.getAttribute('href')||''; if(/^https?:\/\//i.test(href)){[...ch.attributes].forEach(x=>{if(!['href','class'].includes(x.name))ch.removeAttribute(x.name)}); ch.target='_blank'; ch.rel='noopener'; walk(ch); return;} }
      if(!OK_TAGS.has(ch.tagName)){ if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(ch.tagName)){ch.remove();return} ch.replaceWith(...ch.childNodes); return walk(el); }
      [...ch.attributes].forEach(a=>{const n=a.name.toLowerCase();
        const keep=(ch.tagName==='IMG'&&(n==='src'||n==='alt'))||n==='colspan'||n==='rowspan';
        if(!keep||(n==='src'&&!/^(media\/[0-9a-f]+\.webp|data:image\/)/i.test(a.value)))ch.removeAttribute(a.name);});
      walk(ch);
    });
  })(rootEl);
  return rootEl.innerHTML;
}

function statsView(){
  const k=counts(), cs=db.cards.filter(c=>c.state!=='new'), now=Date.now();

function heatmap(){
  const days=140, cells=[], start=new Date(Date.now()-(days-1)*DAY);
  for(let i=0;i<start.getDay();i++)cells.push('<i style="visibility:hidden"></i>');
  for(let i=0;i<days;i++){const d=new Date(start.getTime()+i*DAY).toISOString().slice(0,10),v=db.log[d]||0;
    cells.push(`<i class="${v===0?'':v<15?'l1':v<30?'l2':v<50?'l3':'l4'}" title="${d}: ${v} reviews"></i>`);}
  return `<div class="heat">${cells.join('')}</div><div class="legend">Less <i style="background:#f0ede6"></i><i style="background:#dcd6fa"></i><i style="background:#b7adf2"></i><i style="background:#8f82e4"></i><i style="background:#6b5fd3"></i> More</div>`;
}

const MOVES_2027={
  'polity:1ddai5sa0pj':'Fundamental Rights', // Art. 25 'propagate'
  'polity:1n8moimdae4':'Fundamental Rights', // First Amendment changes to FRs
  'polity:1begeg29bp4':'Amendment',          // majority for amending provisions
  'polity:ziha34ai8x':'Fundamental Rights',  // judiciary as 'State' under Art. 12
  'polity:1mxqi7sz2y3':'Fundamental Rights', // Dicey's Rule of Law
  'polity:6sezp9qvmh':'Union & States',       // Parliament's powers over creation of territories
  'polity:2ci58l76st4':'Emergency',            // effects of emergencies on Centre-State relations
  'polity:24ejc2f91of':'Federal System',       // Inter-State Council
  'polity:1n3r82rxtpl':'Preamble',             // Preamble questions
  'polity:sjdchh57t4':'Parliamentary System',  // image-only MCQ, answer (c)
  'polity:3lzgop4mvq':'Emergency',             // conditions for National Emergency
  'polity:f0sh48uw0l':'Amendment',             // types of majority statements

function cardKey(c){ let t=plain(c.front).replace(/\s+/g,' ').trim().toLowerCase().slice(0,300); if(!t){ const m=(c.front||'').match(/src="([^"]+)"/); t='img:'+(m?m[1].split('/').pop():''); } let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<t.length;i++){const ch=t.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (c.deckId+':'+(4294967296*(2097151&h2)+(h1>>>0)).toString(36)); }
function applyMoves(target){ let n=0; target.cards.forEach(c=>{ if(c.batch)return; const t=MOVES_2027[cardKey(c)]; if(t!==undefined){c.batch='PNP 2027'; if(t&&!(c.tags||[]).includes(t))c.tags=[t]; n++;} }); return n; }

function doMove(id){

function moveBack(id){ const c=db.cards.find(x=>x.id===id); if(!c)return; if(c.prevTags)c.tags=c.prevTags; delete c.prevTags; delete c.batch; delete c.moved; save(); render(); toast('Moved back to PNP 2026'); }

function openRevise(deckId){
  const cs=cardsFor({deck:deckId});

function rvPool(){ return cardsFor({deck:rv.deck}).filter(c=>topicsOf(c).some(t=>rv.sel.has(rvKey(c,t)))); }
function rvQueue(){
  const now=Date.now(), pool=rvPool();
  const due=pool.filter(c=>isDue(c,now)).sort((a,b)=>a.due-b.due);
  const nw=pool.filter(c=>c.state==='new');
  const rest=pool.filter(c=>c.state!=='new'&&!isDue(c,now)).sort((a,b)=>retr(a,now)-retr(b,now)); // weakest first
  const n=rv.n==='all'?pool.length:Math.min(+rv.n||0,pool.length);

  if(rv.order==='shuffle'){for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]];}}
  const mix={due:pick.filter(c=>isDue(c,now)).length,new:pick.filter(c=>c.state==='new').length}; mix.extra=pick.length-mix.due-mix.new;
  return {pick,mix,poolSize:pool.length};
}
function drawRevise(){

      <div class="counts">${presets.map(p=>`<button class="chip ${rv.n!=='all'&&+rv.n===p?'on':''}" onclick="rv.n=${p};drawRevise()">${p}</button>`).join('')}

        <input type="number" min="1" placeholder="Custom" value="${custom?rv.n:''}" onchange="rv.n=Math.max(1,parseInt(this.value)||1);drawRevise()"></div></div>
    <div class="rv-sec"><div class="lbl"><span>Which topics?</span></div>
      <div class="btabs">${BATCHES.map(b=>`<button class="${rv.tab===b?'on':''}" ${bt[b].n?'':'disabled'} onclick="rv.tab='${b}';drawRevise()"><span>${b}</span><small>${bt[b].n} cards${bt[b].sel?` · ${bt[b].sel} topic${bt[b].sel===1?'':'s'} picked`:''}</small></button>`).join('')}</div>
      <div class="lbl" style="margin-top:12px"><span style="text-transform:none;letter-spacing:0;font-weight:600">${rv.tab}: ${selHere} of ${topics.length} topics selected</span>

      ${topics.length?'':`<p class="muted" style="font-size:13px">No ${rv.tab} cards in this subject yet.</p>`}
      <div class="topics-list">${topics.map((t,i)=>`<div class="topic ${rv.sel.has(rv.tab+'|'+t)?'on':''}" onclick="rvToggle(${i})"><span class="box"></span><span>${esc(t)}</span><span class="n">${topicStats[t].n}${topicStats[t].due?`<span class="d">${topicStats[t].due} due</span>`:''}</span></div>`).join('')}</div></div>
    <div class="rv-sec"><div class="lbl"><span>Order</span></div>
      <div class="seg"><button class="${rv.order==='smart'?'on':''}" onclick="rv.order='smart';drawRevise()">Due first</button><button class="${rv.order==='shuffle'?'on':''}" onclick="rv.order='shuffle';drawRevise()">Shuffle</button></div></div>
    <div class="rv-sum"><span><b>${pick.length} question${pick.length===1?'':'s'}</b> · ${mix.due} due · ${mix.new} new${mix.extra?` · ${mix.extra} extra practice`:''}</span><span>≈ ${Math.max(1,Math.round(pick.length*8/60))} min</span></div>

/* Extra card packs (cards made from your notes, etc). Added on top of existing data — progress, stars and edits are kept. */
const PACKS=['polity_notes_1.json','polity_recall_1.json','polity_recall_2.json','polity_recall_3.json'];
async function applyPacks(target){
  target.packs=target.packs||[]; let added=0;
  for(const file of PACKS){
    if(target.packs.includes(file))continue;
    try{
      const pk=await (await fetch(file)).json(), now=Date.now();
      if(!target.decks.find(d=>d.id===pk.deck))continue;
      pk.cards.forEach(c=>{target.cards.push({id:uid(),deckId:pk.deck,front:c.front,back:c.back,html:true,tags:c.tags.filter(t=>!CLEAN_TAGS.includes(t)),stage:c.stage||'',batch:c.batch||pk.batch||'',state:'new',s:0,d:5,due:now,reps:0,lapses:0,last:null});added++;});
      target.packs.push(file);
    }catch(e){ console.log('[recall] could not load pack',file,e); }
  }
  return added;
}
/* remove the 'Common mistake' line from cards already saved in a browser */
function stripMistakes(target){ let n=0; target.cards.forEach(c=>{ if(c.back&&c.back.includes('Common mistake:')){ const nb=c.back.replace(/<p>⚠\s*<strong>Common mistake:<\/strong>[\s\S]*?<\/p>/g,''); if(nb!==c.back){c.back=nb;n++;} } }); return n; }
async function freshData(){const d=seed(); await addShippedDecks(d); await applyPacks(d); applyMoves(d); return d;}
$('#resetBtn').onclick=async(e)=>{const b=e.currentTarget; if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Tap again to reset everything';setTimeout(()=>{delete b.dataset.arm;b.textContent='Reset all progress'},3500);return}
  delete b.dataset.arm;b.textContent='Reset all progress'; db=await freshData();save();go('home');toast('All progress reset – every card is new again')};
(async()=>{ if(!db){db=await freshData();save();} else { const n=await applyPacks(db); if(applyMoves(db))save(); if(stripMistakes(db))save(); if(n){save(); setTimeout(()=>toast(`${n} new cards added to your deck`),400);} } const h0=(location.hash||'').slice(1); go(VIEWS.includes(h0)?h0:'home'); })();
</script>
